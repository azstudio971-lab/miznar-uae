# Codemagic — بناء WudCar ورفعه إلى TestFlight
#
# قبل أول تشغيل (مرة واحدة، من حسابك):
# 1) Codemagic → Teams → Integrations → Developer Portal: أضف مفتاح App Store Connect API
#    (صلاحية App Manager) وسمّه بالاسم في الأسفل: WudCar ASC Key
# 2) Codemagic → المشروع → Environment variables، مجموعة باسم wudcar:
#      TEAM_ID       = معرّف فريقك في Apple (10 أحرف)
#      APP_STORE_ID  = رقم Apple ID للتطبيق من App Store Connect (بعد إنشاء سجل التطبيق)
# 3) تأكد أن App ID للمعرّف أدناه مفعّل عليه CarPlay Audio (audio + video) في Apple Developer.

workflows:
  wudcar-validate:
    name: WudCar — unsigned simulator validation
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Compile simulator app
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project WdCar.xcodeproj -scheme WdCar \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/validation \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/validation/Build/Products/Debug-iphonesimulator/*.app
  wudcar-testflight:
    name: WudCar → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: WudCar ASC Key
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.azstudio.wudcar
      vars:
        XCODE_PROJECT: WdCar.xcodeproj
        XCODE_SCHEME: WdCar
        BUNDLE_ID: com.azstudio.wudcar
        TEAM_ID: QS29RVJPUT
        APP_STORE_ID: "6823772404"
    scripts:
      - name: تثبيت XcodeGen
        script: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: إنشاء مشروع Xcode
        script: |
          set -euo pipefail
          xcodegen generate
      - name: التحقق من المشروع (بناء Debug للمحاكي)
        script: |
          set -euo pipefail
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: تجهيز التوقيع
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: رقم البناء
        script: |
          set -euo pipefail
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_ID" || echo 0)
          NEXT=$((LATEST + 1))
          echo "Build number: $NEXT"
          agvtool new-version -all $NEXT
      - name: بناء IPA (Release)
        script: |
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      - name: Verify signed CarPlay entitlement and scene
        script: |
          set -euo pipefail
          AUDIT_DIR=$(mktemp -d)
          unzip -q build/ios/ipa/*.ipa -d "$AUDIT_DIR"
          APP_PATH=$(find "$AUDIT_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)
          codesign -d --entitlements :- "$APP_PATH" > "$AUDIT_DIR/signed.plist" 2>/dev/null
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$AUDIT_DIR/profile.plist"
          python3 - "$APP_PATH/Info.plist" "$AUDIT_DIR/signed.plist" "$AUDIT_DIR/profile.plist" <<'PY'
          import plistlib, sys
          info, signed, profile = [plistlib.load(open(p, "rb")) for p in sys.argv[1:]]
          audio = "com.apple.developer.carplay-audio"
          video = "com.apple.developer.carplay-video"
          assert signed.get(audio) is True, "Signed app is missing CarPlay Audio"
          assert not signed.get(video), "Do not combine CarPlay Audio and Video"
          assert profile["Entitlements"].get(audio) is True, "Profile is missing CarPlay Audio"
          assert not profile["Entitlements"].get(video), "Profile includes incompatible Video entitlement"
          assert info["CFBundleIdentifier"] == "com.azstudio.wudcar"
          scenes = info["UIApplicationSceneManifest"]["UISceneConfigurations"]
          scene = scenes["CPTemplateApplicationSceneSessionRoleApplication"][0]
          assert scene["UISceneClassName"] == "CPTemplateApplicationScene"
          assert scene["UISceneDelegateClassName"].endswith(".CarSceneDelegate")
          print("PASS: exported IPA has CarPlay Audio, matching profile, and CarPlay scene")
          print("Build:", info["CFBundleShortVersionString"], info["CFBundleVersion"])
          print("Profile:", profile["Name"])
          PY
          rm -rf "$AUDIT_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
