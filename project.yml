name: WdCar
options:
  bundleIdPrefix: com.azstudio
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: 3.0.1
    CURRENT_PROJECT_VERSION: '4'
    VERSIONING_SYSTEM: apple-generic
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 2e0868f5ed40fe59cd92f377645fdcc260c6e759
targets:
  WdCar:
    type: application
    platform: iOS
    scheme: {}
    dependencies:
    - package: VLCKit
      product: VLCKit
    - target: WudCarScreenRelay
      embed: true
    - target: WudCarCastWidget
      embed: true
    sources:
    - path: WdCar
    - path: Extensions/Shared
    settings:
      base:
        PRODUCT_NAME: WdCar
        PRODUCT_BUNDLE_IDENTIFIER: com.azstudio.wudcar
        DEVELOPMENT_TEAM: ''
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Config/WdCar.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
  WdCarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: WdCarTests
      excludes:
      - WudCar.storekit
    - path: WdCarTests/WudCar.storekit
      buildPhase: resources
    dependencies:
    - target: WdCar
    - package: VLCKit
      product: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azstudio.wudcar.tests
        GENERATE_INFOPLIST_FILE: true
    scheme:
      storeKitConfiguration: WdCarTests/WudCar.storekit
      testTargets:
      - WdCarTests
  WudCarScreenRelay:
    type: app-extension
    platform: iOS
    sources:
    - path: Extensions/ScreenRelay
      excludes:
      - Info.plist
      - ScreenRelay.entitlements
    - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azstudio.wudcar.ScreenRelay
        INFOPLIST_FILE: Extensions/ScreenRelay/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Extensions/ScreenRelay/ScreenRelay.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  WudCarCastWidget:
    type: app-extension
    platform: iOS
    sources:
    - path: Extensions/CastWidget
      excludes:
      - Info.plist
      - CastWidget.entitlements
    - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azstudio.wudcar.CastWidget
        INFOPLIST_FILE: Extensions/CastWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Extensions/CastWidget/CastWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
