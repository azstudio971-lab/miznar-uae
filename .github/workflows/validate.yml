name: Validate WudCar
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/verify_frozen_browser.py
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project WdCar.xcodeproj -scheme WdCar -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Run independent 1.6.0 native regressions
        timeout-minutes: 40
        run: |
          set -euo pipefail
          DEVICE=$(bash scripts/select_storekit_simulator.sh)
          xcodebuild -project WdCar.xcodeproj -scheme WdCarTests -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 300 -resultBundlePath /tmp/WudCar160.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- test
      - name: Export native verification images
        if: always()
        run: |
          mkdir -p build/160-verification
          xcrun xcresulttool export attachments --path /tmp/WudCar160.xcresult --output-path build/160-verification || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wudcar160-native-verification
          path: |
            build/160-verification
            /tmp/WudCar160.xcresult
