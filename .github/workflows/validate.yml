name: Validate WudCar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_xcode.py
      - run: xcodebuild -project ios/WudCar.xcodeproj -scheme WudCar -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
