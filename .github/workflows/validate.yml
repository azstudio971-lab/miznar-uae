name: Validate WudCar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_xcode.py
      - name: Verify Video source entitlement
        run: python3 scripts/ci/verify_video_signing.py --source
      - name: Build and test the native browser
        run: bash scripts/ci/test_ios.sh
      - name: Package native simulator preview
        run: bash scripts/ci/build_simulator.sh
      - name: Export browser screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/artifacts/WudCarBrowser.xcresult --output-path build/artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wudcar-browser-ios-results
          path: |
            build/artifacts/WudCarBrowser.xcresult
            build/artifacts/screenshots
            build/artifacts/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: WudCar-iOS-Simulator
          path: |
            build/artifacts/WudCar-iOS-Simulator.zip
            build/artifacts/preview-manifest.json
