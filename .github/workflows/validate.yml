name: Validate WudCar
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project WdCar.xcodeproj -scheme WdCar -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Run independent 1.6.0 native regressions
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[v["udid"] for k,a in d["devices"].items() for v in a if "iOS" in k and "iPhone" in v["name"]]; print(ids[0])')
          xcodebuild -project WdCar.xcodeproj -scheme WdCarTests -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:WdCarTests/Release150Tests -only-testing:WdCarTests/Release160Tests -only-testing:WdCarTests/Release17Tests -resultBundlePath /tmp/WudCar160.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- test
      - name: Export native verification images
        if: always()
        run: |
          mkdir -p build/160-verification
          xcrun xcresulttool export attachments --path /tmp/WudCar160.xcresult --output-path build/160-verification || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wudcar160-native-verification
          path: |
            build/160-verification
            /tmp/WudCar160.xcresult
