name: Validate WudCar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_xcode.py
      - name: Browser URL policy tests
        run: |
          swiftc ios/WudCar/Models/BrowserPolicy.swift tests/ios/main.swift -o /tmp/wudcar-browser-tests
          /tmp/wudcar-browser-tests
      - name: Build and test the native browser
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcodebuild -project ios/WudCar.xcodeproj -scheme WudCar -destination "platform=iOS Simulator,id=$device_id" -configuration Debug CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -resultBundlePath /tmp/WudCarBrowser.xcresult test
      - name: Export browser screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path /tmp/WudCarBrowser.xcresult --output-path /tmp/wudcar-browser-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wudcar-browser-ios-results
          path: |
            /tmp/WudCarBrowser.xcresult
            /tmp/wudcar-browser-attachments
